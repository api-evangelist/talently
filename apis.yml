name: Talently
description: Talently is a Latin American tech hiring and talent marketplace connecting software
  engineers and digital professionals (Tech, Marketing, Sales, Product, Customer Experience) with
  technology companies across LATAM and the United States. The platform offers pre-evaluated talent,
  free job postings, and a suite of hiring tools including per-country tech salary calculators, a
  technical glossary, and specialized job boards. Backed by 500 Global. Public web surface spans
  talently.tech plus hire, match, admin, strapi, and stream subdomains; it publishes an llms.txt
  catalog for AI agents but exposes no public developer/API documentation at this time.
